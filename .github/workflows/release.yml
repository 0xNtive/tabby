name: release
# Push a tag vX.Y.Z (matching package.json) and this publishes the ready-made Tabby Island that
# `tabby island install` downloads: universal (Apple silicon + Intel), ad-hoc signed with the
# stable requirement, zipped with a .sha256 next to it and a build provenance attestation
# (gh attestation verify TabbyIsland.zip --repo 0xNtive/tabby). Only commits on main are built,
# and a release's files are never replaced: a fix is a new version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (only if its release has no island yet), e.g. v0.3.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  island:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: The tag is a commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - run: bash island/build.sh --universal
      - run: bash island/test.sh
      - name: Check the app
        run: |
          APP="island/build/Tabby Island.app"
          lipo -archs "$APP/Contents/MacOS/TabbyIsland" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/TabbyIsland" | grep -q x86_64
          codesign --verify --strict "$APP"
          codesign -d -r- "$APP" 2>&1 | grep -q 'identifier "dev.tabby.island"'
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "${TAG#v}"
      - name: Zip it
        working-directory: island/build
        run: |
          ditto -c -k --norsrc --noextattr --keepParent "Tabby Island.app" TabbyIsland.zip
          shasum -a 256 TabbyIsland.zip | awk '{print $1}' > TabbyIsland.zip.sha256
          cat TabbyIsland.zip.sha256
      - name: Attest where the zip was built
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: island/build/TabbyIsland.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${TAG#v}" 'index($0, "## " v " ") == 1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          install='**Install:** paste `Install tabby for me: run curl -fsSL https://claude-tabby.vercel.app/install.md and follow it.` into Claude Code, or run `curl -fsSL https://claude-tabby.vercel.app/install | bash`. `TabbyIsland.zip` is what the installer downloads (it checks the .sha256). It isn'"'"'t notarized, so a copy downloaded through a browser is blocked by Gatekeeper: use the installer, or `tabby island install`.'
          notes=$(printf '%s\n\n---\n%s\n' "${notes:-See CHANGELOG.md}" "$install")
          files=(island/build/TabbyIsland.zip island/build/TabbyIsland.zip.sha256)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" # fails if the release already has them
          else
            gh release create "$TAG" "${files[@]}" --title "tabby ${TAG#v}" --notes "$notes"
          fi
